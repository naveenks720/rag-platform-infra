name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tf-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}

defaults:
  run:
    shell: bash
    working-directory: terraform

jobs:
  apply:
    runs-on: ubuntu-latest
    # Create this environment in the repo settings and add required reviewers
    # to get a manual approval gate before anything changes in AWS.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=rag-platform-infra/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: plan
        run: terraform plan -input=false -no-color -var-file=envs/dev.tfvars -out=tfplan

      - name: apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: show outputs
        run: terraform output
