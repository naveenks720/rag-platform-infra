name: terraform-plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # OIDC
  contents: read
  pull-requests: write # plan comment

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}

defaults:
  run:
    shell: bash
    working-directory: terraform

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=rag-platform-infra/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: terraform plan -input=false -no-color -lock=false -var-file=envs/dev.tfvars | tee plan.txt

      # The repo is public, so the comment carries only the one-line summary. The full plan
      # (account ID, ARNs, names) stays in the run logs, where GitHub masks the account ID.
      - name: comment plan summary on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Plan did not produce output. See the run for details.';
            try {
              const text = fs.readFileSync('terraform/plan.txt', 'utf8');
              const m = text.match(/^(Plan: .*|No changes\..*)$/m);
              if (m) summary = m[1];
            } catch (e) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan\n${summary}\n\nFull plan: ${run}`,
            });
